<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="620" viewBox="0 0 1420 620" role="img" aria-labelledby="title desc">
  <title id="title">DVM在TorchNPU中的Inductor融合与代码生成流程</title>
  <desc id="desc">Dynamo和AOTAutograd生成FX Graph，TorchNPU Inductor lowering在Inductor IR上挂载MLIR存量traced_graph，Scheduler确定融合边界后重建FX Graph，再生成DVM k.*代码并通过DVM runtime在Ascend NPU执行。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-custom" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 28px Arial, "Noto Sans CJK SC", sans-serif; fill: #1e293b; }
      .label { font: 600 18px Arial, "Noto Sans CJK SC", sans-serif; fill: #1e293b; text-anchor: middle; }
      .small { font: 600 16px Arial, "Noto Sans CJK SC", sans-serif; fill: #1e293b; text-anchor: middle; }
      .mono { font: 600 17px "DejaVu Sans Mono", monospace; fill: #1e293b; text-anchor: middle; }
      .arrow { fill: none; stroke: #475569; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1420" height="620" rx="18" fill="#ffffff"/>
  <text class="title" x="40" y="56">DVM 在 TorchNPU 中的 Inductor 融合与代码生成</text>

  <rect x="40" y="130" width="190" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text class="label" x="135" y="168"><tspan x="135">PyTorch 模型</tspan><tspan x="135" dy="28">torch.compile</tspan></text>

  <rect x="280" y="130" width="200" height="90" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text class="small" x="380" y="168"><tspan x="380">Dynamo / AOTAutograd</tspan><tspan class="label" x="380" dy="28">FX Graph</tspan></text>

  <rect x="530" y="130" width="210" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text class="label" x="635" y="168"><tspan x="635">TorchNPU Inductor</tspan><tspan x="635" dy="28">lowering</tspan></text>

  <rect x="790" y="130" width="230" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text class="label" x="905" y="168"><tspan x="905">Inductor IR</tspan><tspan x="905" dy="28">挂载 traced_graph</tspan></text>

  <rect x="1070" y="130" width="230" height="90" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
  <text class="label" x="1185" y="168"><tspan x="1185">Scheduler节点融合</tspan><tspan x="1185" dy="28">fused snodes</tspan></text>

  <path class="arrow" d="M 230 175 H 272"/>
  <path class="arrow" d="M 480 175 H 522"/>
  <path class="arrow" d="M 740 175 H 782"/>
  <path class="arrow" d="M 1020 175 H 1062"/>

  <path class="arrow" d="M 1185 220 V 270 H 180 V 302"/>

  <rect x="40" y="310" width="280" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text class="label" x="180" y="350"><tspan x="180">复用MLIR存量 traced_graph</tspan><tspan x="180" dy="28">按融合边界重建FX Graph</tspan></text>

  <rect x="370" y="310" width="250" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text class="label" x="495" y="350"><tspan x="495">DVM支持检查 / codegen</tspan><tspan x="495" dy="28">FX Graph → k.*</tspan></text>

  <rect x="670" y="310" width="210" height="100" rx="14" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <text class="mono" x="775" y="350"><tspan x="775">@dvm.kernel</tspan><tspan x="775" dy="28">k.* / output_code.py</tspan></text>

  <rect x="930" y="310" width="230" height="100" rx="14" fill="#ffedd5" stroke="#ea580c" stroke-width="3"/>
  <text class="mono" x="1045" y="350"><tspan x="1045">torch_npu._C.dvm</tspan><tspan class="label" x="1045" dy="28">PyBind / DVM runtime</tspan></text>

  <rect x="1210" y="310" width="170" height="100" rx="14" fill="#fee2e2" stroke="#dc2626" stroke-width="3"/>
  <text class="label" x="1295" y="367">Ascend NPU</text>

  <path class="arrow" d="M 320 360 H 362"/>
  <path class="arrow" d="M 620 360 H 662"/>
  <path class="arrow" d="M 880 360 H 922"/>
  <path class="arrow" d="M 1160 360 H 1202"/>

  <rect x="370" y="500" width="250" height="80" rx="14" fill="#f1f5f9" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7"/>
  <text class="label" x="495" y="532"><tspan x="495">不支持的节点</tspan><tspan x="495" dy="26">Inductor fallback</tspan></text>
  <path d="M 495 410 V 492" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="9 7" marker-end="url(#arrow-muted)"/>

  <rect x="670" y="500" width="210" height="80" rx="14" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
  <text class="label" x="775" y="532"><tspan x="775">用户自定义builder</tspan><tspan class="mono" x="775" dy="26">@dvm.kernel</tspan></text>
  <path d="M 880 540 H 1045 V 418" fill="none" stroke="#d97706" stroke-width="3" marker-end="url(#arrow-custom)"/>
</svg>
